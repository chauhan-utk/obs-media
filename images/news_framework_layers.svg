<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<g class="c-gray">
  <rect x="40" y="310" width="600" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="331" text-anchor="middle" dominant-baseline="central">Layer 1 — Raw news</text>
  <text class="ts" x="340" y="350" text-anchor="middle" dominant-baseline="central">What happened. Everyone sees this.</text>
</g>

<g class="c-teal">
  <rect x="60" y="230" width="560" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="251" text-anchor="middle" dominant-baseline="central">Layer 2 — First-order effect</text>
  <text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">Who immediately wins or loses? Most people stop here.</text>
</g>

<g class="c-purple">
  <rect x="80" y="150" width="520" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="171" text-anchor="middle" dominant-baseline="central">Layer 3 — Second-order effect</text>
  <text class="ts" x="340" y="190" text-anchor="middle" dominant-baseline="central">What changes because of the first-order effect? This is where edge is.</text>
</g>

<g class="c-amber">
  <rect x="100" y="70" width="480" height="52" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="91" text-anchor="middle" dominant-baseline="central">Layer 4 — Narrative shift</text>
  <text class="ts" x="340" y="110" text-anchor="middle" dominant-baseline="central">Is this event changing a long-term story? This is the rarest signal.</text>
</g>

<line x1="340" y1="122" x2="340" y2="148" class="arr" stroke="var(--color-border-primary)" marker-end="url(#arrow)"/>
<line x1="340" y1="202" x2="340" y2="228" class="arr" stroke="var(--color-border-primary)" marker-end="url(#arrow)"/>
<line x1="340" y1="282" x2="340" y2="308" class="arr" stroke="var(--color-border-primary)" marker-end="url(#arrow)"/>

<text class="ts" x="340" y="22" text-anchor="middle" dominant-baseline="central">The 4 layers of reading any news event</text>
<text class="ts" x="600" y="96" text-anchor="start">← rare</text>
<text class="ts" x="600" y="336" text-anchor="start">← common</text>
</svg>